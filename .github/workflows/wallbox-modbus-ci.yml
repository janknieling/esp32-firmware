name: Wallbox Modbus/TCP branch CI
on:
  workflow_dispatch:
  push:
    branches:
      - claude/wallbox-modbus-tcp-748okn
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [warp3, energy_manager_v2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/uv
            ~/.platformio
            ./software/.pio
            ./software/packages
          key: wallbox-modbus-${{ matrix.env }}-${{ github.run_id }}
          restore-keys: |
            wallbox-modbus-${{ matrix.env }}-
            ubuntu-latest-
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Sync UV
        working-directory: ./software
        run: uv sync
      - name: 'Build Firmware: ${{ matrix.env }}'
        working-directory: ./software
        run: uv run pio run -e ${{ matrix.env }}
      - name: Dump generated translation.tsx on failure
        if: failure()
        working-directory: ./software
        run: |
          python3 - <<'PY'
          import re, subprocess
          # Re-run tsc to capture the first syntax error line, then print that
          # region with repr() so hidden Unicode characters become visible.
          r = subprocess.run(['npx','tsc','--build','tsconfig.json'],
                             capture_output=True, text=True, cwd='web/src')
          out = r.stdout + r.stderr
          lines = open('web/src/ts/translation.tsx', encoding='utf-8').read().split('\n')
          errs = sorted(set(int(m.group(1)) for m in re.finditer(r'translation\.tsx\((\d+),', out)))
          first = errs[0] if errs else 9061
          print("first tsc error line:", first, "total error lines:", len(errs))
          for i in range(max(0, first-14), min(len(lines), first+3)):
              print(i+1, repr(lines[i]))
          PY
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            ~/.cache/uv
            ~/.platformio
            ./software/.pio
            ./software/packages
          key: wallbox-modbus-${{ matrix.env }}-${{ github.run_id }}
