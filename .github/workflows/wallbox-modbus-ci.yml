name: Wallbox Modbus/TCP branch CI
on:
  workflow_dispatch:
  push:
    branches:
      - claude/wallbox-modbus-tcp-748okn
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [warp3, energy_manager_v2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/uv
            ~/.platformio
            ./software/.pio
            ./software/packages
          key: wallbox-modbus-${{ matrix.env }}-${{ github.run_id }}
          restore-keys: |
            wallbox-modbus-${{ matrix.env }}-
            ubuntu-latest-
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Sync UV
        working-directory: ./software
        run: uv sync
      - name: 'Build Firmware: ${{ matrix.env }}'
        working-directory: ./software
        run: uv run pio run -e ${{ matrix.env }}
      - name: Dump generated translation.tsx on failure
        if: failure()
        working-directory: ./software
        run: |
          echo "=== chargers_modbus_tcp occurrences ==="
          grep -n "chargers_modbus_tcp" web/src/ts/translation.tsx | head -40 || true
          echo "=== register_row / register_add_message lines ==="
          grep -n "register_row\|register_add_message\|role_1:" web/src/ts/translation.tsx || true
          echo "=== lines 9060-9110 (warp3 first error region) ==="
          sed -n '9060,9110p' web/src/ts/translation.tsx || true
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            ~/.cache/uv
            ~/.platformio
            ./software/.pio
            ./software/packages
          key: wallbox-modbus-${{ matrix.env }}-${{ github.run_id }}
